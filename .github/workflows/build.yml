name: Build WordPress Plugin
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  lint-and-package:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Prepare PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          tools: none
      - name: Check PHP syntax
        run: |
          find . -name '*.php' -type f -print0 | xargs -0 -n1 php -l
      - name: Check JavaScript syntax
        run: node --check assets/js/app.js
      - name: Test UI and chart contracts
        run: node --test tests/*.test.mjs
      - name: Test recurring loan schedule and amortization
        run: php tests/loan-schedule.test.php
      - name: Test subscription calendar
        run: php tests/subscription-schedule.test.php
      - name: Test private receipt filesystem safety
        run: |
          php tests/private-receipts.test.php safe
          php tests/private-receipts.test.php unsafe
          php tests/receipt-media.test.php
      - name: Package installable plugin ZIP
        run: |
          mkdir -p dist staging/wumetax-finance
          cp wumetax-finance.php staging/wumetax-finance/
          cp -r includes assets templates staging/wumetax-finance/
          cp README.md staging/wumetax-finance/
          cd staging
          zip -q -r ../dist/wumetax-finance.zip wumetax-finance
      - name: Upload installable ZIP
        uses: actions/upload-artifact@v4
        with:
          name: wumetax-finance-wordpress-plugin
          path: dist/wumetax-finance.zip
          if-no-files-found: error
